{% extends "base.html" %}
{% block content %}
<div class="auth-page">
  <div class="auth-panel">

    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i data-lucide="zap" class="w-5 h-5 text-white"></i>
      </div>
      <span class="auth-logo-name">FinTrack</span>
    </div>

    <h1>Reset your password</h1>
    <p>Enter a new password for your account.</p>

    {% if error == 'weak' %}
    <div class="alert alert-danger">Password must be at least 8 characters.</div>
    {% endif %}

    <form action="/auth/reset-password" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" name="token" value="{{ token }}" />
      <div class="form-group">
        <label for="password">New Password <span style="color:var(--t3);font-size:0.8rem">(min 8 characters)</span></label>
        <input id="password" name="password" type="password"
               placeholder="••••••••" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary">Reset Password</button>
    </form>

  </div>
</div>
{% endblock %}
